# Minimal pyproject for tests + tooling.  Runtime deps live in the
# Dockerfile because the production image is built from there; this
# file exists so contributors can `pip install -e ".[test]"` locally
# and run pytest without standing up the Docker stack for every
# unit-level change.
[project]
name = "voice-assistant-orchestrator"
version = "0.0.0"
description = "Voice-assistant orchestrator (tests + local dev tooling)"
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "pydantic>=2.6",
    "numpy<2",
    # Required by app/push.py (VAPID key parsing).  Imported at module
    # load time, so any test that touches push (or transitively imports
    # main.py) needs this in the test env.
    "cryptography>=42",
    # Required by app/scheduler.py and tools/set_reminder.py.  Without
    # this the reminders tool fails to import (silently — the registry
    # catches and logs), reducing test parity with production.
    "apscheduler>=3.10,<4",
]

[tool.pytest.ini_options]
# All test cases use asyncio (the orchestrator is async everywhere); the
# default mode lets us write `async def test_…` without per-test markers.
asyncio_mode = "auto"
testpaths = ["tests"]
# Don't show the long import errors from optional deps (resemblyzer,
# fastembed, aiortc) — those aren't installed in CI test envs.  The
# conftest.py mocks the ones tests actually exercise.
filterwarnings = [
    "ignore::DeprecationWarning",
]
