# Source of truth for the orchestrator's runtime — the service runs
# natively via uv (`./start.sh`, com.voiceassistant.orchestrator
# LaunchAgent).  The Dockerfile mirrors this list for the optional
# docker-compose path (Linux servers); keep them in sync when adding
# a dependency.
[project]
name = "voice-assistant-orchestrator"
version = "0.0.0"
description = "Voice-assistant orchestrator — agent loop, tools, storage"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "httpx>=0.27,<0.28",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "numpy<2",
    # Wake/VAD + search + page extraction
    "openwakeword",
    "ddgs",
    "selectolax>=0.3,<0.4",
    "trafilatura>=1.12",
    # Semantic memory (ONNX MiniLM via fastembed)
    "fastembed>=0.4,<0.5",
    # Reminders / GC jobs
    "apscheduler>=3.10,<4",
    # WebRTC (mic up / TTS down); PyAV+pylibsrtp wheels vendor FFmpeg+libsrtp
    "aiortc>=1.9",
    # Auth + Web Push
    "bcrypt>=4.1",
    "pywebpush>=2.0",
    "cryptography>=42",
    # Locale-aware numbers / dates
    "num2words>=0.5.13",
    "Babel>=2.16",
    # summarize_url audio/video path
    "yt-dlp>=2025.1",
    # Speaker ID: GE2E d-vectors.  torch is CPU-bound here (25 MB model);
    # on macOS the default wheel is fine, on Linux prefer the cpu index
    # (see Dockerfile) to avoid the CUDA download.
    "torch",
    "resemblyzer",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
# All test cases use asyncio (the orchestrator is async everywhere); the
# default mode lets us write `async def test_…` without per-test markers.
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
